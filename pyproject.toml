[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-rename-columns"
version = "1.0.0"
description = "Rename CSV columns from a mapping"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "TataneSan"}]
keywords = ["cli", "text", "utility"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.scripts]
csv-rename-columns = "csv_rename_columns.cli:main"

[tool.setuptools.packages.find]
include = ["csv_rename_columns*"]
